name: Core critical checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      AW_WEBUI_DIR: ${{ github.workspace }}/aw-webui/dist
      EXPECTED_WEBUI_REV: 9ab60a2cc406102749fbe53cb760d4f817fe7711
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          submodules: recursive
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify reviewed dependency source
        run: |
          test "$(git rev-parse HEAD:aw-webui)" = "$EXPECTED_WEBUI_REV"
          test "$(git -C aw-webui rev-parse HEAD)" = "$EXPECTED_WEBUI_REV"
          git submodule status --recursive
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24.20.0'
          package-manager-cache: false
      - name: Install reviewed Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal --no-self-update
      - name: Build real embedded WebUI assets
        run: |
          npm ci --prefix aw-webui --no-audit --no-fund
          make -C aw-webui build
          test -s "$AW_WEBUI_DIR/index.html"
          test -s "$AW_WEBUI_DIR/peakactivity.svg"
          test -s "$AW_WEBUI_DIR/LICENSE.txt"
      - name: Build encrypted server with plugin runtime
        run: cargo +1.98.1 build --locked -p aw-server --bin aw-server --no-default-features --features encryption,plugin-runtime
      - name: Check real Wasmtime limits and sample ABI
        run: |
          cargo +1.98.1 test --locked -p aw-plugin-runtime --lib wasm_ -- --test-threads=1
          cargo +1.98.1 test --locked -p aw-plugin-runtime --lib checked_in_noop_sample_uses_the_v1_core_module_abi -- --test-threads=1
      - name: Check encrypted plugin storage and scoped approval routes
        run: |
          cargo +1.98.1 test --locked -p aw-datastore --no-default-features --features encryption --test plugin_storage --test plugin_events -- --test-threads=1
          cargo +1.98.1 test --locked -p aw-server --no-default-features --features encryption,plugin-runtime,companion --test plugin_routes --test companion_bridge -- --test-threads=1
      - name: Check closed plugin schema and vectors
        run: |
          python3 -m venv "$RUNNER_TEMP/plugin-schema"
          "$RUNNER_TEMP/plugin-schema/bin/python" -m pip install --disable-pip-version-check jsonschema==4.19.2
          "$RUNNER_TEMP/plugin-schema/bin/python" -m unittest scripts.tests.test_plugin_boundary.PluginBoundaryTest.test_manifest_schema_and_synthetic_vectors_are_strict scripts.tests.test_plugin_boundary.PluginBoundaryTest.test_plugin_annotation_write_schema_is_closed_and_bounded
          cargo +1.98.1 test --locked -p aw-models --test plugin_contract plugin_write_intents_require_a_registered_closed_schema -- --test-threads=1
      - name: Check dependency locks are unchanged
        run: |
          git diff --exit-code -- Cargo.lock
          git -C aw-webui diff --exit-code -- package-lock.json
