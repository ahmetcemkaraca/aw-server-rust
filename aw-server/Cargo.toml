[package]
name = "aw-server"
version = "0.14.0"
authors = ["Johan Bjäreholt <johan@bjareho.lt>", "Erik Bjäreholt <erik@bjareho.lt>"]
edition = "2021"

[lib]
name = "aw_server"
crate-type = ["lib", "cdylib"]
path = "src/lib.rs"

[[bin]]
name = "aw-server"
path = "src/main.rs"

[features]
default = ["bundled"]
# Use bundled SQLite (default, no encryption support)
bundled = ["aw-datastore/bundled", "aw-egress/bundled"]
# Enable SQLCipher encryption support (requires OpenSSL)
# Build with: cargo build --no-default-features --features encryption
encryption = ["aw-datastore/encryption", "aw-egress/encryption", "dep:aw-sync-e2ee"]
# Enable SQLCipher encryption with vendored OpenSSL (fully self-contained)
encryption-vendored = ["aw-datastore/encryption-vendored", "aw-egress/encryption-vendored", "dep:aw-sync-e2ee"]
plugin-runtime = ["dep:aw-plugin-runtime"]

[dependencies]
base64 = "0.22"
rocket = { version = "0.5.0", features = ["json"] }
rocket_cors = { version = "0.6.0" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
lazy_static = "1.4"
log = "0.4"
fern = { version = "0.7", features = ["colored"] }
toml = "0.8"
gethostname = "0.4"
uuid = { version = "1.3", features = ["serde", "v4"] }
clap = { version = "4.1", features = ["derive", "cargo", "env"] }
log-panics = { version = "2", features = ["with-backtrace"]}
subtle = "2"
getrandom = "0.2"
rust-embed = { version = "8.0.0", features = ["interpolate-folder-path", "debug-embed"] }
aw-datastore = { path = "../aw-datastore", default-features = false }
aw-egress = { path = "../aw-egress", default-features = false }
aw-sync-e2ee = { path = "../aw-sync-e2ee", optional = true }
aw-models = { path = "../aw-models" }
aw-plugin-runtime = { path = "../aw-plugin-runtime", optional = true, default-features = false }
aw-transform = { path = "../aw-transform" }
aw-query = { path = "../aw-query", default-features = false }
ring = "0.17"
zeroize = "1"

[target.'cfg(target_os="linux")'.dependencies]
sd-notify = "0.4.2"

[target.'cfg(all(target_os="linux", target_arch="x86"))'.dependencies]
jemallocator = "0.5.0"

[target.'cfg(target_os="android")'.dependencies]
jni = { version = "0.20", default-features = false }
libc = "0.2"
android_logger = "0.13"
openssl-sys = { version = "0.9.82", features = ["vendored"]}
aw-client-rust = { path = "../aw-client-rust" }

[dev-dependencies]
base64 = "0.22"
zeroize = "1"

[[test]]
name = "sync_routes"
path = "tests/sync_routes.rs"
required-features = ["encryption"]

[[test]]
name = "sync_control"
path = "tests/sync_control.rs"
required-features = ["encryption"]

[[test]]
name = "plugin_host"
path = "tests/plugin_host.rs"
required-features = ["encryption", "plugin-runtime"]
